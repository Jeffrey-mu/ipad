name: build-deb

# 没有 Mac 也能打包：GitHub 云端 macOS 跑 theos，产物发到 Release。
# 触发方式：push 到 main，或在 Actions 页面点 "Run workflow"。
# 产物：
#   https://github.com/Jeffrey-mu/ipad/releases/latest/download/Pin120.deb
#   https://github.com/Jeffrey-mu/ipad/releases/latest/download/BallKey.deb
# 这俩 URL 是固定的，iPad 上 Safari 打开就能装（公开仓库，无需登录）。

on:
  push:
    branches: [main]
    paths:
      - 'Pin120/**'
      - 'BallKey/**'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deb
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos + iOS SDK
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

          # 只取需要的那一个 SDK，别拉整个 sdks 仓库
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          ( cd "$RUNNER_TEMP/sdks" && git sparse-checkout set iPhoneOS16.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: 编译 Pin120
        run: |
          set -euo pipefail
          cd Pin120
          make package FINALPACKAGE=1

      - name: 编译 BallKey
        run: |
          set -euo pipefail
          cd BallKey
          make package FINALPACKAGE=1

      - name: 收集 deb
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$(ls -t Pin120/packages/*.deb | head -1)" out/Pin120.deb
          cp "$(ls -t BallKey/packages/*.deb | head -1)" out/BallKey.deb
          ls -la out

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/*.deb
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: |
            自动构建 `${{ github.sha }}`

            * Pin120 2.0.0 — 60Hz iPad Pro 上解锁游戏 120fps
            * BallKey — 键鼠映射

            固定下载地址：
            * /releases/latest/download/Pin120.deb
            * /releases/latest/download/BallKey.deb
          files: out/*.deb
          make_latest: true
