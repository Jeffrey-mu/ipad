name: build-deb

# 娌℃湁 Mac 涔熻兘鎵撳寘锛欸itHub 浜戠 macOS 璺?theos锛屼骇鐗╁彂鍒?Release銆?# 瑙﹀彂鏂瑰紡锛歱ush 鍒?main锛屾垨鍦?Actions 椤甸潰鐐?"Run workflow"銆?# 浜х墿锛?#   https://github.com/Jeffrey-mu/ipad/releases/latest/download/Pin120.deb
#   https://github.com/Jeffrey-mu/ipad/releases/latest/download/BallKey.deb
# 杩欎咯 URL 鏄浐瀹氱殑锛宨Pad 涓?Safari 鎵撳紑灏辫兘瑁咃紙鍏紑浠撳簱锛屾棤闇€鐧诲綍锛夈€?
on:
  push:
    branches: [main]
    paths:
      - 'Pin120/**'
      - 'BallKey/**'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deb
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 瀹夎 Theos + iOS SDK
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

          # 鍙彇闇€瑕佺殑閭ｄ竴涓?SDK锛屽埆鎷夋暣涓?sdks 浠撳簱
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          ( cd "$RUNNER_TEMP/sdks" && git sparse-checkout set iPhoneOS16.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: 缂栬瘧 Pin120
        run: |
          set -o pipefail
          cd Pin120
          make package FINALPACKAGE=1 2>&1 | tee ../ci-build.log

      - name: 缂栬瘧 BallKey
        run: |
          set -o pipefail
          cd BallKey
          make package FINALPACKAGE=1 2>&1 | tee -a ../ci-build.log

      - name: 澶辫触鏃舵妸鏋勫缓鏃ュ織鎻愪氦鍥炰粨搴擄紙鏂逛究鎺掓煡锛?        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          ls -la ci-build.log || true
          git add -f ci-build.log || true
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: 鏀堕泦 deb
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$(ls -t Pin120/packages/*.deb | head -1)" out/Pin120.deb
          cp "$(ls -t BallKey/packages/*.deb | head -1)" out/BallKey.deb
          ls -la out

      - name: 涓婁紶 artifact
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/*.deb
          if-no-files-found: error

      - name: 鍙戝竷鍒?Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 鏈€鏂版瀯寤?          body: |
            鑷姩鏋勫缓 `${{ github.sha }}`

            * Pin120 2.0.0 鈥?60Hz iPad Pro 涓婅В閿佹父鎴?120fps
            * BallKey 鈥?閿紶鏄犲皠

            鍥哄畾涓嬭浇鍦板潃锛?            * /releases/latest/download/Pin120.deb
            * /releases/latest/download/BallKey.deb
          files: out/*.deb
          make_latest: true
